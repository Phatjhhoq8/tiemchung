services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medicare_codo
      DB_USERNAME: root
      DB_PASSWORD: ""
      TEST_DB_HOST: mysql
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: yvidlapc_tiemchung_testing
      DB_USERNAME: root
      DB_PASSWORD: ""
      TEST_DB_HOST: mysql
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-lc", "php artisan migrate:fresh --force && php artisan test"]

  mysql:
    image: mysql:8.0
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: medicare_codo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  app_vendor:
  mysql_data:
